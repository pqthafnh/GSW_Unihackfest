name: Anchor check
on:
  push:
    paths: ["programs/**", "Anchor.toml", "Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["programs/**", "Anchor.toml", "Cargo.toml", "Cargo.lock"]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.84.0
      - name: Check escrow crate
        run: cargo check --manifest-path programs/escrow/Cargo.toml
      - name: Format escrow crate
        run: cargo fmt --manifest-path programs/escrow/Cargo.toml -- --check
